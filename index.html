<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Water Leak Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin-top: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .normal { color: green; font-weight: bold; }
        .danger { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IoT Water Leak Monitor</h1>
        <p>Sensor Value: <span id="sensorValue">--</span></p>
        <p>System Status: <span id="systemStatus" class="normal">Waiting for device...</span></p>
    </div>

    <script>
        const binURL = "https://api.npoint.io/f5599e0247815c812af6";

        function fetchData() {
            fetch(binURL)
                .then(response => response.json())
                .then(data => {
                    if (data) {
                        document.getElementById("sensorValue").innerText = data.value;
                        const statusElement = document.getElementById("systemStatus");
                        statusElement.innerText = data.status;
                        if (data.value > 300) {
                            statusElement.className = "danger";
                        } else {
                            statusElement.className = "normal";
                        }
                    }
                });
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
